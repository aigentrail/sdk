[project]
name = "gentrail"
version = "0.7.0"
description = "Gentrail SDK: governance hooks, inline policy enforcement, and telemetry capture for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["governance", "ai-agents", "compliance", "opentelemetry", "strands"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "google-re2>=1.1",
    "pydantic>=2.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.urls]
Homepage = "https://gentrail.ai"
Repository = "https://github.com/aigentrail/sdk"
Issues = "https://github.com/aigentrail/sdk/issues"

[project.optional-dependencies]
strands = ["strands-agents>=0.1.0; python_version >= '3.10'"]
openai-agents = ["openai-agents>=0.4; python_version >= '3.10'"]
langchain = ["langchain>=1.0; python_version >= '3.10'"]
http = ["httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["gentrail"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pin the lint rule set explicitly: ruff's implicit defaults grew in 0.16 and
# started failing CI on code that never opted into the new opinions (the blind
# except in enforcement.py is the SDK's deliberate fail-open contract).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
