[project]
name = "gentrail"
version = "0.1.0"
description = "Gentrail SDK — governance hooks and telemetry capture for AI agents"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.optional-dependencies]
strands = ["strands-agents>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["gentrail"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pin the lint rule set explicitly: ruff's implicit defaults grew in 0.16 and
# started failing CI on code that never opted into the new opinions (the blind
# except in enforcement.py is the SDK's deliberate fail-open contract).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
