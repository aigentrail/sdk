name: publish-npm
on:
  push:
    tags: ['js-v*']
jobs:
  packages:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
  npm:
    needs: packages
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: sdk-packages
          path: packages
      - run: npm publish packages/javascript/gentrail-ai-*.tgz --provenance --access public
