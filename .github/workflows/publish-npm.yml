name: publish-npm

on:
  push:
    tags: ['js-v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: js/gentrail-ai
      - run: npm test
        working-directory: js/gentrail-ai
      - run: npm publish --provenance --access public
        working-directory: js/gentrail-ai
