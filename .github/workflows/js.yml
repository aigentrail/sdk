name: js

on:
  push:
    branches: [main]
    paths: ['js/**', 'spec/**', '.github/workflows/js.yml']
  pull_request:
    paths: ['js/**', 'spec/**', '.github/workflows/js.yml']

defaults:
  run:
    working-directory: js/gentrail-ai

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
