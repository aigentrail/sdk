name: publish
on:
  push:
    tags: ['v*']
jobs:
  packages:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
  pypi:
    needs: packages
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-packages
          path: packages
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python
